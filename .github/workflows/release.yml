name: 构建与发布
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macmark-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  test:
    name: 原生测试 · ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 校验版本更新说明
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ "$(head -n 1 RELEASE_NOTES.md)" != "## $GITHUB_REF_NAME" ]]; then
            echo "请更新 RELEASE_NOTES.md，只填写本次版本的变化，首行应为：## $GITHUB_REF_NAME"
            exit 1
          fi
      - name: 运行选区、导出和编辑测试
        run: scripts/test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: annotation-preview-${{ matrix.runner }}
          path: .build/*preview.png
          if-no-files-found: ignore
          include-hidden-files: true
  build:
    name: 构建 Universal 安装包
    needs: test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 设置版本号
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.1.4" >> "$GITHUB_ENV"
          fi
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: 双架构编译、签名和验证
        run: scripts/build.sh
      - name: 菜单栏启动及空闲采样
        run: scripts/smoke.sh
      - name: 生成 DMG、ZIP 和 SHA256
        run: scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacMark-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/idle-sample.txt
          if-no-files-found: error
  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MacMark-universal
          path: dist
      - name: 发布下载附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt dist/idle-sample.txt \
            --verify-tag --title "轻截 MacMark $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
